services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trip_splitter
    ports:
      - "5432:5432"
    volumes:
      - trip_splitter_db_data:/var/lib/postgresql/data

volumes:
  trip_splitter_db_data:
